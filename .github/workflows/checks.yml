name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  qml-tests:
    name: QML Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - name: Run QML tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
          QT_LOGGING_TO_CONSOLE: 1
        run: qmltestrunner -input tests -platform offscreen -o results.xml,junitxml -o -,txt

      - name: Upload QML test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qml-test-results
          path: results.xml

      - name: Report QML test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: QML Tests
          path: results.xml
          reporter: java-junit

  functions-tests:
    name: Functions Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Run functions tests
        working-directory: functions
        run: node --test --test-reporter=junit --test-reporter-destination=results.xml

      - name: Upload functions test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-results
          path: functions/results.xml

      - name: Report functions test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Functions Tests
          path: functions/results.xml
          reporter: java-junit

  firestore-rules-tests:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests
        run: firebase emulators:exec --only firestore "node --test --test-reporter=junit --test-reporter-destination=results.xml test/firestore.rules.test.js"

      - name: Upload rules test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-test-results
          path: results.xml

      - name: Report rules test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Firestore Rules Tests
          path: results.xml
          reporter: java-junit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run E2E tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
          QT_LOGGING_TO_CONSOLE: 1
          QML_XHR_ALLOW_FILE_READ: 1
        run: |
          firebase emulators:exec --only firestore,auth,functions \
            "node test/e2e/seed.js && qmltestrunner -input test/e2e -platform offscreen -o results.xml,junitxml -o -,txt"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: results.xml

      - name: Report E2E test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Tests
          path: results.xml
          reporter: java-junit

  pr-comment:
    name: PR Test Summary Comment
    runs-on: ubuntu-latest
    needs: [qml-tests, functions-tests, firestore-rules-tests, e2e-tests]
    # Runs even if some/all test jobs failed or were cancelled -- that's the case we most need
    # to report on. Only runs on pull_request (there's no PR to comment on for a plain push).
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # continue-on-error: a job that crashed before its own upload step ran (e.g. npm ci
      # failure, Qt install failure) won't have produced an artifact at all. That's a real,
      # reportable state ("no results"), not a reason to fail this job and lose the comment.
      - name: Download all test result artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-test-results'
        continue-on-error: true

      # Tests the comment-building/parsing logic itself before trusting it to post to the PR --
      # a bug here should fail loudly in CI, not silently produce a wrong/garbled comment.
      - name: Run PR comment script's own unit tests
        run: node --test "./.github/scripts/__tests__/*.test.js"

      - name: Post PR test summary comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          QML_TESTS_RESULT: ${{ needs.qml-tests.result }}
          FUNCTIONS_TESTS_RESULT: ${{ needs.functions-tests.result }}
          FIRESTORE_RULES_TESTS_RESULT: ${{ needs.firestore-rules-tests.result }}
          E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
        run: node .github/scripts/post-ci-comment.js
