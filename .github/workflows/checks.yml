name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Re-run the deploy of main by hand (failed deploy, rejected approval). Only main can deploy.
  workflow_dispatch:

jobs:
  qml-tests:
    name: QML Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - name: Run QML tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
          QT_LOGGING_TO_CONSOLE: 1
        run: qmltestrunner -input tests -platform offscreen -o results.xml,junitxml -o -,txt

      - name: Upload QML test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qml-test-results
          path: results.xml

      - name: Report QML test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: QML Tests
          path: results.xml
          reporter: java-junit

  functions-tests:
    name: Functions Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Run functions tests
        working-directory: functions
        run: node --test --test-reporter=junit --test-reporter-destination=results.xml

      - name: Upload functions test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-results
          path: functions/results.xml

      - name: Report functions test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Functions Tests
          path: functions/results.xml
          reporter: java-junit

  firestore-rules-tests:
    name: Firestore + Storage Rules Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run Firestore + Storage rules tests
        run: firebase emulators:exec --only firestore,storage "node --test --test-reporter=junit --test-reporter-destination=results.xml test/firestore.rules.test.js test/storage.rules.test.js"

      - name: Upload rules test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-test-results
          path: results.xml

      - name: Report rules test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Firestore Rules Tests
          path: results.xml
          reporter: java-junit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run E2E tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
          QT_LOGGING_TO_CONSOLE: 1
          QML_XHR_ALLOW_FILE_READ: 1
        run: |
          firebase emulators:exec --only firestore,auth,functions,storage \
            "node test/e2e/seed.js && qmltestrunner -input test/e2e -platform offscreen -o results.xml,junitxml -o -,txt && node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=results-recordOperation.xml test/e2e/recordOperation.e2e.test.js && node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=results-cleanupSweep.xml test/e2e/cleanupSweep.e2e.test.js"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            results.xml
            results-recordOperation.xml
            results-cleanupSweep.xml

      - name: Report E2E test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Tests
          path: results*.xml
          reporter: java-junit

  pr-comment:
    name: PR Test Summary Comment
    runs-on: ubuntu-latest
    needs: [qml-tests, functions-tests, firestore-rules-tests, e2e-tests]
    # Runs even if some/all test jobs failed or were cancelled -- that's the case we most need
    # to report on. Only runs on pull_request (there's no PR to comment on for a plain push).
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # continue-on-error: a job that crashed before its own upload step ran (e.g. npm ci
      # failure, Qt install failure) won't have produced an artifact at all. That's a real,
      # reportable state ("no results"), not a reason to fail this job and lose the comment.
      - name: Download all test result artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-test-results'
        continue-on-error: true

      # Tests the comment-building/parsing logic itself before trusting it to post to the PR --
      # a bug here should fail loudly in CI, not silently produce a wrong/garbled comment.
      - name: Run PR comment script's own unit tests
        run: node --test .github/scripts/__tests__/*.test.js

      - name: Post PR test summary comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          QML_TESTS_RESULT: ${{ needs.qml-tests.result }}
          FUNCTIONS_TESTS_RESULT: ${{ needs.functions-tests.result }}
          FIRESTORE_RULES_TESTS_RESULT: ${{ needs.firestore-rules-tests.result }}
          E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
        run: node .github/scripts/post-ci-comment.js

  # ---- Firebase deploy on merge (design: docs/superpowers/specs/2026-10-28-ci-deploy-on-merge-design.md) ----
  # Pre-launch there is ONE Firebase project and Functions are shared by dev/test/prd, so this deploy is
  # the only deploy. One-tap approval (GitHub Environment `firebase-deploy`, required reviewer = Taher)
  # keeps "device-test before it ships". When a real prod stage exists, revisit (see the design doc).
  deploy-check:
    name: Deploy Check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.diff.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Compare against the LAST DEPLOYED commit (tag `deployed-main`), not against this push: a pending
      # approval can be superseded by a newer run, and a push-only diff would then lose its changes.
      - name: Did anything deployable change since the last deploy?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          needed=true
          if [ "$EVENT" != "workflow_dispatch" ] && git rev-parse -q --verify refs/tags/deployed-main >/dev/null; then
            if files=$(git diff --name-only deployed-main "$GITHUB_SHA"); then
              needed=$(printf '%s\n' "$files" | node .github/scripts/deploy-paths.js)
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "Deploy needed: $needed" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Firebase
    needs: [qml-tests, functions-tests, firestore-rules-tests, e2e-tests, deploy-check]
    if: needs.deploy-check.outputs.needed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: firebase-deploy
    # One deploy at a time; never cancel one that is mid-flight (half-deployed state).
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # The CLI loads functions/index.js locally to discover triggers, so deps must be installed.
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # No --force: a deleted function makes this fail loudly instead of deleting it in prod.
      # storage.rules is deliberately not deployed from CI (Taher 2026-10-28).
      - name: Deploy functions + firestore rules + firestore indexes
        run: npx --yes firebase-tools@15.25.1 deploy --only functions,firestore:rules,firestore:indexes --project inventorymanager-48392 --non-interactive

      - name: Record the deployed commit
        run: |
          git tag -f deployed-main "$GITHUB_SHA"
          git push --force origin refs/tags/deployed-main
          echo "Deployed $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
